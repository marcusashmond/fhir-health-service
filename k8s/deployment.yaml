apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-health-service
  labels:
    app: fhir-health-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fhir-health-service
  template:
    metadata:
      labels:
        app: fhir-health-service
    spec:
      # The app never calls the Kubernetes API, so it gets no token.
      automountServiceAccountToken: false
      securityContext:
        # 65532 is the nonroot user in the distroless base image. The kubelet
        # needs a numeric UID to verify runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fhir-health-service
          # Replace with your built/pushed image, e.g. ghcr.io/you/fhir-health-service:v1.0.0
          image: fhir-health-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: fhir-health-service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
